[package]
name = "helm-proto"
description = "Wire protocol shared by the helm app and the helmd persistence daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
## Async client used by helm-app to talk to a helmd (local socket now;
## the SSH stdio bridge reuses the same frame pump at the transport level).
client = ["dep:tokio", "dep:tracing"]

[dev-dependencies]
helmd = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "client_e2e"
required-features = ["client"]
