[package]
name = "helm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Helm — a terminal that is mission control for agents across machines"
default-run = "helm"

[lib]
name = "helm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "helm"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
helm-domain.workspace = true
helm-proto = { workspace = true, features = ["client"] }
helm-ssh.workspace = true

tauri.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true

tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
dirs.workspace = true
ssh2-config.workspace = true
base64.workspace = true
uuid.workspace = true
semver.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
# Pinned to the versions tao/wry already pull in, so we position the traffic
# lights through the same objc2 bindings rather than forking the dep tree.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSGraphics"] }
security-framework.workspace = true
system-configuration = "0.7.0"
